<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone - Reseñas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #141414; color: white; }
        .card { background-color: #181818; border: 1px solid #2f2f2f; color: white; }
        .badge-positiva { background-color: #2ecc71; }
        .badge-excelente { background-color: #f1c40f; color: black; }
        .badge-negativa { background-color: #e74c3c; }
        .review-box { background: #222; border-radius: 5px; padding: 10px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container my-5">
        <h1 class="text-center mb-5 text-danger fw-bold">🎬 Catálogo de Productos y Reseñas</h1>
        
        <div id="contenedor-productos" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            </div>
    </div>

    <script>
        // URL base de tu API en Spring Boot
        const API_PRODUCTOS = '/api/productos';
        const API_RESENAS = '/api/reseñas/producto/';

        // Al cargar la página, obtenemos los productos
        document.addEventListener("DOMContentLoaded", async () => {
            const contenedor = document.getElementById("contenedor-productos");
            
            try {
                const response = await fetch(API_PRODUCTOS);
                const productos = await response.json();

                if(productos.length === 0) {
                    contenedor.innerHTML = `<p class="text-center w-100 text-muted">No hay productos disponibles. Agrega algunos mediante Postman.</p>`;
                    return;
                }

                // Por cada producto, creamos su tarjeta y buscamos sus reseñas
                for (const producto of productos) {
                    // 1. Buscamos las reseñas de este producto específico
                    const resResenas = await fetch(`${API_RESENAS}${producto.id}`);
                    const reseñas = await resResenas.json();

                    // 2. Armamos el HTML de los comentarios
                    let listaReseñasHTML = '';
                    if(reseñas.length === 0) {
                        listaReseñasHTML = `<p class="text-muted small">Sin reseñas aún.</p>`;
                    } else {
                        reseñas.forEach(r => {
                            // Validamos tu escala de calificación (0=negativa, 1=positiva, 2=excelente)
                            let badge = '';
                            if(r.calificacion === 2) badge = '<span class="badge badge-excelente">★ Excelente</span>';
                            else if(r.calificacion === 1) badge = '<span class="badge badge-positiva">👍 Positiva</span>';
                            else badge = '<span class="badge badge-negativa">👎 Negativa</span>';

                            listaReseñasHTML += `
                                <div class="review-box">
                                    <div class="d-flex justify-content-between">
                                        <strong class="text-info">@${r.usuario}</strong>
                                        ${badge}
                                    </div>
                                    <p class="mb-0 small text-secondary">${r.comentario}</p>
                                </div>
                            `;
                        });
                    }

                    // 3. Creamos la estructura de la tarjeta (Card)
                    const tarjetaHTML = `
                        <div class="col">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title text-danger fw-bold">${producto.titulo}</h5>
                                    <h6 class="card-subtitle mb-2 text-muted">${producto.tipo} • ${producto.anyoEstreno}</h6>
                                    <p class="card-text flex-grow-1">${producto.descripcion}</p>
                                    <div class="mt-2 text-muted small mb-3">
                                        <span>⏱️ ${producto.duracionMinutos} min</span> | 
                                        <span>👥 ${producto.publico}</span>
                                    </div>
                                    <hr style="border-color: #333;">
                                    <h6>💬 Comentarios:</h6>
                                    <div class="reviews-container" style="max-height: 200px; overflow-y: auto;">
                                        ${listaReseñasHTML}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += tarjetaHTML;
                }
            } catch (error) {
                console.error("Error al cargar los datos:", error);
                contenedor.innerHTML = `<p class="text-danger text-center w-100">Error al conectar con el servidor.</p>`;
            }
        });
    </script>
</body>
</html>
